[package]
name = "unistructgen-agent"
version = "0.1.0"
edition = "2021"
description = "Agent Runtime and DAG orchestration for UniStructGen"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
unistructgen-core = { path = "../core", version = "0.1.0" }
unistructgen-llm = { path = "../llm", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
async-trait = "0.1"
uuid = { version = "1.0", features = ["v4"] }
regex = "1.10"
