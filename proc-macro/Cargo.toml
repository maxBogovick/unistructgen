[package]
name = "unistructgen-macro"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Procedural macros for unistructgen - compile-time struct generation from JSON and external APIs"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords = ["macro", "procedural-macro", "json", "codegen", "api"]
categories.workspace = true

[lib]
proc-macro = true

[dependencies]
unistructgen-core = { path = "../core", version = "0.1.0" }
unistructgen-json-parser = { path = "../parsers/json_parser", version = "0.1.0" }
unistructgen-openapi-parser = { path = "../parsers/openapi_parser", version = "0.1.0" }
unistructgen-env-parser = { path = "../parsers/env_parser", version = "0.1.0" }
unistructgen-sql-parser = { path = "../parsers/sql_parser", version = "0.1.0" }
unistructgen-graphql-parser = { path = "../parsers/graphql_parser", version = "0.1.0" }
unistructgen-codegen = { path = "../codegen", version = "0.1.0" }
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"

uuid = { version = "1.0", features = ["serde", "v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client for API calls
ureq = { version = "2.10", features = ["json"] }

[dev-dependencies]
validator = { version = "0.18", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
