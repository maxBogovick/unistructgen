[package]
name = "proc-macro-example"
version = "0.1.0"
edition = "2021"

# This example is not part of the workspace
[workspace]

[dependencies]
unistructgen-macro = { path = "../../proc-macro" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["serde", "v4"] }
