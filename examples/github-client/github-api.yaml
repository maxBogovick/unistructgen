openapi: 3.0.0
info:
  title: GitHub API (Simplified)
  description: |
    Type-safe GitHub API client auto-generated by UniStructGen

    This demonstrates the power of automatic code generation:
    - 20+ endpoints with full type safety
    - Automatic validation from OpenAPI constraints
    - Zero boilerplate - just use the generated types!
  version: 1.0.0
  contact:
    name: GitHub API
    url: https://docs.github.com/rest

servers:
  - url: https://api.github.com

paths:
  /user:
    get:
      summary: Get authenticated user
      operationId: getAuthenticatedUser
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /users/{username}:
    get:
      summary: Get a user by username
      operationId: getUserByUsername
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /user/repos:
    get:
      summary: List repositories for authenticated user
      operationId: listUserRepos
      parameters:
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: List of repositories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Repository'

    post:
      summary: Create a repository
      operationId: createRepo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRepositoryRequest'
      responses:
        '201':
          description: Repository created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Repository'

  /repos/{owner}/{repo}:
    get:
      summary: Get a repository
      operationId: getRepo
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Repository details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Repository'

  /repos/{owner}/{repo}/issues:
    get:
      summary: List repository issues
      operationId: listRepoIssues
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
            enum: [open, closed, all]
            default: open
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        '200':
          description: List of issues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Issue'

    post:
      summary: Create an issue
      operationId: createIssue
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIssueRequest'
      responses:
        '201':
          description: Issue created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'

  /repos/{owner}/{repo}/issues/{issue_number}:
    get:
      summary: Get an issue
      operationId: getIssue
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: issue_number
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Issue details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'

    patch:
      summary: Update an issue
      operationId: updateIssue
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: issue_number
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIssueRequest'
      responses:
        '200':
          description: Issue updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'

  /repos/{owner}/{repo}/pulls:
    get:
      summary: List pull requests
      operationId: listPullRequests
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
            enum: [open, closed, all]
            default: open
      responses:
        '200':
          description: List of pull requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PullRequest'

    post:
      summary: Create a pull request
      operationId: createPullRequest
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePullRequestRequest'
      responses:
        '201':
          description: Pull request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullRequest'

components:
  schemas:
    User:
      type: object
      required:
        - id
        - login
        - type
      properties:
        id:
          type: integer
          format: int64
          description: Unique user ID
        login:
          type: string
          minLength: 1
          maxLength: 39
          pattern: '^[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?$'
          description: GitHub username
        name:
          type: string
          maxLength: 255
          description: Full name
        email:
          type: string
          format: email
          description: Public email
        bio:
          type: string
          maxLength: 160
          description: User biography
        type:
          type: string
          enum: [User, Organization, Bot]
          description: Account type
        public_repos:
          type: integer
          minimum: 0
          default: 0
        public_gists:
          type: integer
          minimum: 0
          default: 0
        followers:
          type: integer
          minimum: 0
          default: 0
        following:
          type: integer
          minimum: 0
          default: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        avatar_url:
          type: string
          format: uri
        html_url:
          type: string
          format: uri

    Repository:
      type: object
      required:
        - id
        - name
        - owner
        - private
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[a-zA-Z0-9._-]+$'
          description: Repository name
        full_name:
          type: string
          description: Full repository name (owner/repo)
        owner:
          $ref: '#/components/schemas/User'
        private:
          type: boolean
          default: false
          description: Whether repository is private
        description:
          type: string
          maxLength: 350
          description: Repository description
        fork:
          type: boolean
          default: false
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        pushed_at:
          type: string
          format: date-time
        homepage:
          type: string
          format: uri
        size:
          type: integer
          minimum: 0
          description: Size in KB
        stargazers_count:
          type: integer
          minimum: 0
          default: 0
        watchers_count:
          type: integer
          minimum: 0
          default: 0
        language:
          type: string
          description: Primary programming language
        forks_count:
          type: integer
          minimum: 0
          default: 0
        open_issues_count:
          type: integer
          minimum: 0
          default: 0
        default_branch:
          type: string
          default: main
        topics:
          type: array
          items:
            type: string
            pattern: '^[a-z0-9-]+$'
          maxItems: 20
        visibility:
          type: string
          enum: [public, private, internal]
        has_issues:
          type: boolean
          default: true
        has_projects:
          type: boolean
          default: true
        has_wiki:
          type: boolean
          default: true

    CreateRepositoryRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[a-zA-Z0-9._-]+$'
        description:
          type: string
          maxLength: 350
        homepage:
          type: string
          format: uri
        private:
          type: boolean
          default: false
        has_issues:
          type: boolean
          default: true
        has_projects:
          type: boolean
          default: true
        has_wiki:
          type: boolean
          default: true
        auto_init:
          type: boolean
          default: false
          description: Create initial README

    Issue:
      type: object
      required:
        - id
        - number
        - title
        - state
        - user
      properties:
        id:
          type: integer
          format: int64
        number:
          type: integer
          description: Issue number (not ID!)
        title:
          type: string
          minLength: 1
          maxLength: 256
        body:
          type: string
          maxLength: 65536
        user:
          $ref: '#/components/schemas/User'
        labels:
          type: array
          items:
            $ref: '#/components/schemas/Label'
          maxItems: 100
        state:
          type: string
          enum: [open, closed]
        locked:
          type: boolean
          default: false
        assignees:
          type: array
          items:
            $ref: '#/components/schemas/User'
          maxItems: 10
        comments:
          type: integer
          minimum: 0
          default: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
        html_url:
          type: string
          format: uri

    CreateIssueRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 256
        body:
          type: string
          maxLength: 65536
        labels:
          type: array
          items:
            type: string
          maxItems: 100
        assignees:
          type: array
          items:
            type: string
          maxItems: 10

    UpdateIssueRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 256
        body:
          type: string
          maxLength: 65536
        state:
          type: string
          enum: [open, closed]
        labels:
          type: array
          items:
            type: string
          maxItems: 100

    PullRequest:
      type: object
      required:
        - id
        - number
        - title
        - state
        - user
        - head
        - base
      properties:
        id:
          type: integer
          format: int64
        number:
          type: integer
        title:
          type: string
          minLength: 1
          maxLength: 256
        body:
          type: string
          maxLength: 65536
        user:
          $ref: '#/components/schemas/User'
        state:
          type: string
          enum: [open, closed]
        locked:
          type: boolean
          default: false
        head:
          $ref: '#/components/schemas/PullRequestBranch'
        base:
          $ref: '#/components/schemas/PullRequestBranch'
        merged:
          type: boolean
          default: false
        mergeable:
          type: boolean
        comments:
          type: integer
          minimum: 0
          default: 0
        commits:
          type: integer
          minimum: 0
        additions:
          type: integer
          minimum: 0
        deletions:
          type: integer
          minimum: 0
        changed_files:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        merged_at:
          type: string
          format: date-time
        html_url:
          type: string
          format: uri

    CreatePullRequestRequest:
      type: object
      required:
        - title
        - head
        - base
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 256
        body:
          type: string
          maxLength: 65536
        head:
          type: string
          description: Branch name containing changes
        base:
          type: string
          description: Branch name you want changes pulled into

    PullRequestBranch:
      type: object
      required:
        - ref
        - sha
      properties:
        label:
          type: string
        ref:
          type: string
          description: Branch name
        sha:
          type: string
          pattern: '^[0-9a-f]{40}$'
          description: Git commit SHA
        user:
          $ref: '#/components/schemas/User'
        repo:
          $ref: '#/components/schemas/Repository'

    Label:
      type: object
      required:
        - id
        - name
        - color
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          maxLength: 50
        color:
          type: string
          pattern: '^[0-9a-fA-F]{6}$'
          description: Hex color without #
        description:
          type: string
          maxLength: 100
