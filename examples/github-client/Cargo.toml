
[package]
name = "github-client"
version = "0.1.0"
edition = "2021"
description = "Type-safe GitHub API client auto-generated by UniStructGen"

[[bin]]
name = "demo"
path = "src/demo.rs"

[dependencies]
# UniStructGen - This generates ALL the types! ✨
unistructgen-macro = { path = "../../unistructgen-macro" }
unistructgen = { path = "../../", features = ["full"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "blocking"] }
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Validation (auto-generated from OpenAPI constraints!)
validator = { version = "0.18", features = ["derive"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1"
thiserror = "1"

# CLI
clap = { version = "4", features = ["derive"] }
colored = "2"
