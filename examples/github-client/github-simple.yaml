openapi: 3.0.0
info:
  title: GitHub API (Simplified Demo)
  description: Simplified GitHub API showing UniStructGen power
  version: 1.0.0

paths: {}

components:
  schemas:
    User:
      type: object
      required:
        - id
        - login
        - user_type
      properties:
        id:
          type: integer
          format: int64
          description: Unique user ID
        login:
          type: string
          minLength: 1
          maxLength: 39
          pattern: '^[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?$'
          description: GitHub username
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
        bio:
          type: string
          maxLength: 160
        user_type:
          type: string
          enum: [User, Organization, Bot]
        public_repos:
          type: integer
          minimum: 0
          default: 0
        followers:
          type: integer
          minimum: 0
          default: 0
        created_at:
          type: string
          format: date-time

    Repository:
      type: object
      required:
        - id
        - name
        - owner_login
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[a-zA-Z0-9._-]+$'
        full_name:
          type: string
        owner_login:
          type: string
          minLength: 1
        description:
          type: string
          maxLength: 350
        private:
          type: boolean
          default: false
        stargazers_count:
          type: integer
          minimum: 0
          default: 0
        forks_count:
          type: integer
          minimum: 0
          default: 0
        language:
          type: string
        created_at:
          type: string
          format: date-time

    Issue:
      type: object
      required:
        - id
        - number
        - title
        - issue_state
      properties:
        id:
          type: integer
          format: int64
        number:
          type: integer
        title:
          type: string
          minLength: 1
          maxLength: 256
        body:
          type: string
          maxLength: 65536
        issue_state:
          type: string
          enum: [open, closed]
        comments_count:
          type: integer
          minimum: 0
          default: 0
        created_at:
          type: string
          format: date-time
