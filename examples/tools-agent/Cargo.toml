[package]
name = "tools-agent"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
unistructgen-core = { path = "../../core" }
unistructgen-macro = { path = "../../proc-macro" }
# We need these dependencies because the macro generated code uses them
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
tokio = { version = "1.0", features = ["full"] }
