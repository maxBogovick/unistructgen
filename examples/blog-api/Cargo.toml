[package]
name = "blog-api"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "blog-api"
path = "src/main.rs"

[dependencies]
# UniStructGen - This is the magic! ✨
unistructgen-macro = { path = "../../proc-macro" }
unistructgen-core = { path = "../../core" }

# Web framework
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Validation
validator = { version = "0.18", features = ["derive"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "1"
