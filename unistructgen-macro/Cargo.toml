[package]
name = "unistructgen-macro"
version = "0.2.2"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Procedural macros for unistructgen"
repository = "https://github.com/maxBogovick/unistructgen"
homepage = "https://github.com/maxBogovick/unistructgen"
documentation = "https://docs.rs/unistructgen"
keywords = ["macro", "codegen", "json", "struct"]
categories = ["development-tools", "development-tools::build-utils"]

[lib]
proc-macro = true

[dependencies]
unistructgen = { path = "../", version = "0.2.2", features = ["full"] }
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
ureq = { version = "2.10", features = ["json"] }

[dev-dependencies]
validator = { version = "0.18", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
