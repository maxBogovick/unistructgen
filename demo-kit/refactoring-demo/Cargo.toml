[package]
name = "refactoring-demo"
version = "0.1.0"
edition = "2021"

[dependencies]
# Standard tools for manual code
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["blocking", "json"] }

# YOUR LIBRARY (The Hero)
# We link strictly to the local path to show it works directly
unistructgen-macro = { path = "../../../proc-macro" }
unistructgen-core = { path = "../../../core" }

# Helper for generated types
uuid = { version = "1.0", features = ["serde", "v4"] }
