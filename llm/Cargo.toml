[package]
name = "unistructgen-llm"
version = "0.1.0"
edition = "2021"
description = "LLM client abstractions for UniStructGen"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
async-trait = "0.1"
reqwest = { version = "0.11", features = ["json", "stream"] }
tokio = { version = "1.0", features = ["full"] }
futures-util = "0.3"
dotenv = "0.15"
