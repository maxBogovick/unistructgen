[package]
name = "unistructgen"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[[bin]]
name = "unistructgen"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
colored = "2.1"
inquire = "0.7"
dotenv = "0.15"
ureq = "2.9"
openapiv3 = { version = "2.0", features = ["skip_serializing_defaults"] }
indexmap = "2.2"

unistructgen-core = { path = "../core" }
unistructgen-llm = { path = "../llm" }
unistructgen-codegen = { path = "../codegen" }
unistructgen-json-parser = { path = "../parsers/json_parser" }
unistructgen-markdown-parser = { path = "../parsers/markdown_parser" }
unistructgen-openapi-parser = { path = "../parsers/openapi_parser" }
unistructgen-sql-parser = { path = "../parsers/sql_parser" }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
