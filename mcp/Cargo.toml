[package]
name = "unistructgen-mcp"
version = "0.1.0"
edition = "2021"
description = "Model Context Protocol (MCP) server implementation for unistructgen"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
unistructgen-core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
futures-util = "0.3"
async-trait = "0.1"

# Optional dependencies for SSE transport
axum = { version = "0.7", optional = true }
tower-http = { version = "0.5", features = ["cors"], optional = true }
uuid = { version = "1.0", features = ["v4"], optional = true }
dashmap = { version = "5.5", optional = true }

[features]
default = []
sse = ["dep:axum", "dep:tower-http", "dep:uuid", "dep:dashmap"]
