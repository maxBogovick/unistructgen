[package]
name = "unistructgen-openapi-parser"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "OpenAPI/Swagger parser for UniStructGen - generates Rust types from OpenAPI specifications"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords = ["openapi", "swagger", "api", "codegen", "parser"]
categories.workspace = true

[dependencies]
# Workspace dependencies
unistructgen-core = { path = "../../core" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true

# OpenAPI parsing
openapiv3 = { version = "2.0", features = ["skip_serializing_defaults"] }
serde_yaml = "0.9"
indexmap = "2.0"

# HTTP client for fetching remote specs
ureq = { version = "2.9", features = ["json"], optional = true }

# Validation support
regex = "1.10"
once_cell = "1.19"

[dev-dependencies]
pretty_assertions = "1.4"
unistructgen-codegen = { path = "../../codegen" }

[features]
default = ["fetch"]
fetch = ["dep:ureq"]
