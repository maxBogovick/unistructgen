[workspace]
members = [
    "core",
    "parsers/json_parser",
    "parsers/openapi_parser",
    "parsers/markdown_parser",
    "parsers/sql_parser",
    "parsers/graphql_parser",
    "parsers/env_parser",
    "codegen",
    "cli",
    "proc-macro",
    "llm",
    "mcp",
    "agent",
    "examples/docu-agent",
    "examples/mcp-server",
    "examples/tools-agent",
    "examples/agent-demo",
    "examples/reverse-ir",
    "examples/killer-example",
]
exclude = [
    "examples/github-client",
    "examples/blog-api",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Maxim"]
description = "A powerful Rust code generator that creates type-safe structs from JSON, Markdown tables, and SQL DDL"
repository = "https://github.com/maxBogovick/unistructgen"
homepage = "https://github.com/maxBogovick/unistructgen"
documentation = "https://docs.rs/unistructgen"
keywords = ["codegen", "json", "struct", "macro", "api"]
categories = ["development-tools", "development-tools::build-utils", "parser-implementations"]
readme = "README.md"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
