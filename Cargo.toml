[package]
name = "unistructgen"
version = "0.2.2"
edition = "2024"
authors = ["Maxim Bogovic (https://bogovick.com)"]
description = "A powerful Rust code generator"
license = "MIT OR Apache-2.0"
repository = "https://github.com/maxBogovick/unistructgen"
readme = "README.md"
keywords = ["codegen", "json", "struct", "macro", "api"]
categories = ["development-tools"]

[workspace]
members = ["unistructgen-macro", "unistructgen-cli"]

# Восстанавливаем наследование для старых манифестов
[workspace.package]
version = "0.2.2"
edition = "2024"
authors = ["Maxim Bogovic (https://bogovick.com)"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/maxBogovick/unistructgen"
homepage = "https://github.com/maxBogovick/unistructgen"
documentation = "https://docs.rs/unistructgen"
keywords = ["codegen", "json", "struct", "macro", "api"]
categories = ["development-tools"]
description = "A powerful Rust code generator"
readme = "README.md"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
futures-util = "0.3"
async-trait = "0.1"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
uuid = { version = "1.0", features = ["v4"] }
regex = "1.10"
ureq = { version = "2.9", features = ["json"] }
openapiv3 = { version = "2.0", features = ["skip_serializing_defaults"] }
serde_yaml = "0.9"
indexmap = "2.0"
reqwest = { version = "0.11", features = ["json", "stream"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
dashmap = "5.5"
tokio-stream = "0.1.18"
sqlparser = "0.43"
graphql-parser = "0.4"
pulldown-cmark = "0.9"
clap = { version = "4.4", features = ["derive"] }
colored = "2.1"
inquire = "0.7"
dotenv = "0.15"

[features]
default = ["json"]
full = ["json", "markdown", "openapi", "sql", "graphql", "env", "llm", "agent", "mcp"]

# Parsers
json = ["dep:serde_json"]
markdown = ["dep:pulldown-cmark"]
openapi = ["dep:openapiv3", "dep:serde_yaml", "dep:indexmap", "dep:ureq", "dep:regex"]
sql = ["dep:sqlparser"]
graphql = ["dep:graphql-parser"]
env = []

# Advanced
llm = ["dep:reqwest", "dep:dotenv", "dep:tokio"]
agent = ["llm", "dep:tracing", "dep:uuid", "dep:regex", "dep:tokio"]
mcp = ["dep:tracing", "dep:axum", "dep:tower-http", "dep:dashmap", "dep:tokio-stream", "dep:uuid", "dep:tokio"]

[dependencies]
serde = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
futures-util = { workspace = true }
async-trait = { workspace = true }

# Optional
serde_json = { workspace = true, optional = true }
pulldown-cmark = { workspace = true, optional = true }
sqlparser = { workspace = true, optional = true }
graphql-parser = { workspace = true, optional = true }
openapiv3 = { workspace = true, optional = true }
serde_yaml = { workspace = true, optional = true }
indexmap = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
dotenv = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
dashmap = { workspace = true, optional = true }
tokio-stream = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt"] }
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
pretty_assertions = "1.4"
validator = { version = "0.18", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
